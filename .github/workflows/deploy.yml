name: Publish Cloudflare Pages
on:
  workflow_dispatch:
    inputs:
      target:
        description: Publication target
        type: choice
        options: [preview, production]
        default: preview
        required: true
permissions:
  contents: read
concurrency:
  group: simal-publish-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CATALOG_CSV_URL: ${{ secrets.CATALOG_CSV_URL }}
      SITE_NOINDEX: ${{ inputs.target == 'preview' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run catalog && npm run content
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Validate publication settings
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing account secret'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing deployment secret'; exit 1; }
      - name: Publish preview
        if: inputs.target == 'preview'
        run: npx --no-install wrangler pages deploy dist --project-name simal --branch preview
      - name: Publish production
        if: inputs.target == 'production'
        run: npx --no-install wrangler pages deploy dist --project-name simal --branch main
